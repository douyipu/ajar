[project]
name = "ajar"
version = "0.1.0"
description = "An auditing agent that enables automated monitoring and interaction with language models to detect potential alignment issues, reward hacking, and other concerning behaviors."
readme = "README.md"
authors = [
    { name = "窦一蒲 DOU Yipu", email = "dev@douyipu.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75.0",
    "e2b-code-interpreter>=2.4.1",
    "fuzzysearch>=0.8.0",
    "google-genai>=1.33.0",
    "inspect-ai>=0.3.252",
    "inspect-petri @ git+https://github.com/meridianlabs-ai/inspect_petri.git@main",
    "ipywidgets>=8.1.7",
    "jinja2>=3.1.6",
    "mcp>=2.0.0",
    "openai>=2.45.0",
    "platformdirs>=4.3.8",
    "pydantic>=2.0",
    "python-dotenv>=1.1.1",
    "tavily-python>=0.7.19",
    "tenacity>=9.1.2",
    "textgrad>=0.1.8",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.8",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["servers", "evals"]

[project.entry-points.inspect_ai]
evals = "evals.registry"
